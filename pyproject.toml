[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medlibra"
version = "0.1.0.dev0"
description = "Vertical de turnos para salud: consultorios, profesionales y centros medicos."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # v0.11.0 -> v0.12.0 (2026-10-17): `crear_esquema` serializa el DDL de LibraGenda entre procesos (ADR-015 de libragenda), para `uvicorn --workers N`. Sin migracion.
    # v0.12.0 -> v0.13.0 (2026-10-18): `AppointmentConflict.resource_ids`, `reschedule(secondary_resource_ids=)` y candados en orden de id (ADR-016 de libragenda); el consultorio pasa a recurso secundario (ADR-042, migracion 0022).
    # v0.13.0 -> v0.14.0 (2026-10-25): `clients` pasa a `agenda_clients` y la tabla de version es `alembic_version_libragenda` (ADR-017/018 de libragenda; ADR-043 de este repo). Correr `libragenda-migrar upgrade` ANTES de arrancar.
    # v0.14.0 -> v0.15.0 (2026-10-25): atender un turno en un nodo sin conexion (`libragenda.atencion_en_nodo`, ADR-019 de libragenda; ADR-045 de este repo). **Migracion `0011_node_attendances`** (dos tablas nuevas, aditiva): correr `libragenda-migrar upgrade` ANTES de arrancar.
    # v0.15.0 -> v0.15.1 (2026-10-25): database.configure normaliza la URL a psycopg 3 (el nodo de LibraEdge la escribe sin driver). Sin migracion.
    "libragenda @ git+https://github.com/marianocappucci/libragenda.git@v0.15.1",
    # libracore sigue proveyendo facturacion/caja/ARCA. El auth SALIO de aca el
    # 2026-07-30 y ahora lo da libraauth (ver app/auth.py y app/services/users.py).
    #
    # v1.6.0 -> v1.8.0 (2026-08-04). Hoy este producto NO usa `pdf_generator`
    # ni `ticket_generator` (verificado: cero imports), asi que ni el arreglo
    # del PDF de v1.7.0 ni la maqueta compacta de v1.8.0 cambian nada de lo que
    # se ve hoy. Se sube igual, y no es cosmetico: el modulo de facturacion es
    # una incorporacion probable, y cuando llegue va a usar esos generadores.
    # Que el pin ya este arriba significa que el modulo aterriza sobre la base
    # arreglada en vez de heredar un bug conocido -- hasta v1.6.0 un guion
    # largo en el nombre de empresa devolvia 500 al descargar el comprobante.
    #
    # v1.29.0 -> v1.31.0 (2026-08-12). Son dos, y solo una cambia algo hoy:
    #
    # - v1.30.0: un comprobante se fecha con SU fecha y no con el reloj, asi que
    #   reimprimirlo da byte a byte el mismo archivo. **Aca no cambia nada**:
    #   sigue sin haber un solo import de los generadores (verificado). Vale lo
    #   mismo que arriba — cuando llegue facturacion, aterriza sobre la base
    #   arreglada.
    # - v1.31.0: `pinear_image` escribia la imagen de la app en el primer
    #   `image:` del compose. **Aca eso es el sidecar**: en docker-compose.yml
    #   `medlibra-postgres` (con `image: postgres:16`) va declarado ANTES que
    #   `medlibra-dev`, o sea el layout exacto donde el bug le pone la imagen de
    #   la aplicacion al contenedor de la base. Este SI es un bug vivo para este
    #   producto. Ahora el servicio se elige por `container_name`.
    #
    # v1.33.0 -> v1.37.0 (2026-08-14): **alineacion, no arreglo.** El salto trae
    # los margenes de los PDF (los comprobantes de la familia se salian del
    # marco del papel), pero **este producto no importa `pdf_generator`** -- se
    # verifico con un grep de los imports, no de memoria. De los cuatro modulos
    # que cambiaron entre las dos versiones no consume ninguno, asi que el bump
    # no le cambia comportamiento.
    #
    # Se bumpea igual para que los 12 repos no diverjan: un parque con pines
    # distintos convierte cada arreglo del motor en una arqueologia de quien
    # tiene que. La suite se corrio contra v1.37.0 antes de subir el pin.
    #
    # v1.37.0 -> v1.38.0 (2026-08-14): las filas meta del membrete tambien se
    # recortan. La caja del valor mide ~31 mm --unos 25 caracteres a 7 pt-- y
    # `cell` no recorta: lo que se pasa se dibujaba afuera del papel. El unico
    # documento que mete texto libre ahi es el RECIBO, que pone el concepto en
    # ("Comprobante:", ref_line). Medido en la demo de VentaLibra: "Pago a
    # cuenta en cuenta corriente" terminaba en 202,2 mm en una hoja de 210.
    #
    # Es anterior a v1.37.0 y aquel arreglo no lo cubria.
    #
    # v1.50.0 sube al motor el vocabulario de medios de pago
    # (`libracore.medios_pago`), que estaba declarado 28 veces en 11 repos. Es
    # de donde sale ahora `GET /medios-pago` de este producto, y con el la
    # tarjeta partida en debito y credito -- el `tarjeta` que este frontend
    # ofrecia no existia en ninguna lista de la familia. Ver
    # wiki/concepts/medios-de-pago-familia-libra.md.
    #
    # v1.51.0 la trajo `develop` en paralelo (las varias cadenas de migraciones).
    # Se queda la mas alta: contiene a v1.50.0 -- verificado con
    # `git merge-base --is-ancestor`, y que `medios_pago.py` este en el tag.
    #
    # v1.122.0 -> v1.123.0 (2026-10-03): `get_config().clientes_dir` (precedencia `configure(clientes_dir=)` > env
    # `LIBRA_CLIENTES_DIR` > `repo_root/clientes`; el default no cambia). Los scripts lo leen de ahi y no recomponen la ruta
    # (wiki: sacar-clientes-del-arbol-del-repo, etapa 1).
    #
    # v1.118.0 -> v1.122.0 (2026-10-03): v1.122.0 es `libracore.testing.pg_por_worker`, el helper de TEST que
    # reemplaza el vaciado de la base entre tests por una base por worker de xdist restaurada desde plantillas
    # (reglas/ci.md del wiki). Subir el pin trae tambien v1.119.0 -> v1.121.0, todo de ARCA y con DOS migraciones
    # del motor (0014: FCE MiPyME y condicion de IVA del receptor; 0015: `facturas.cae_error`), que corren al
    # desplegar: ver el CHANGELOG de libracore.
    # v1.123.0 -> v1.124.0 (2026-10-04): la guarda del CUIT del receptor (`arca_wsfe.problema_del_receptor`, que `solicitar_cae` corre antes de llamar a ARCA): CUIT de 11 digitos en clase A y FCE, y verificador valido en toda clase. El endpoint de notas no lo monta este producto. Sin migracion.
    # v1.124.0 -> v1.126.0 (2026-10-04): suma el nucleo `libracore.notas_de_credito` (este producto todavia no lo usa); la guarda del CUIT del receptor deja de bloquear las notas (ARCA autoriza la nota de credito a un CUIT que no cierra, igual que la factura), e incluye v1.125.0 (los routers de libracore rechazan booleanos en los campos numericos). Sin migracion.
    # v1.141.0 -> v1.142.0 (2026-10-07): credenciales y estado de ARCA por servicio web (`wscpe`, CTG y Carta de Porte); la facturacion no cambia. Migracion 0022 (tabla nueva `arca_credenciales_servicio`).
    # v1.142.0 -> v1.143.0 (2026-10-07): suma libracore.arca_wscpe (lectura de la Carta de Porte de ARCA, ADR-034); este producto no lo usa. Sin migracion.
    # v1.143.0 -> v1.144.0 (2026-10-08): suma la emision de la Carta de Porte (libracore.arca_wscpe, ADR-035); este producto no la usa. Sin migracion.
    # v1.144.0 -> v1.145.0 (2026-10-08): suma geografia.localidad(id) y GET /api/geo/localidades/{id}; este producto no los usa. Sin migracion.
    # v1.145.0 -> v1.146.0 (2026-10-08): el catalogo geografico suma el resto del Mercosur (geografia.paises, parametro pais; por omision Argentina). Sin migracion.
    # v1.146.0 -> v1.147.0 (2026-10-08): el pedido de certificado de ARCA se genera en el servidor (ADR-036 de libracore: rutas `.../pedido`; `GET .../servicios` suma `admite_pedido`). Sin migracion.
    # v1.147.0 -> v1.148.0 (2026-10-09): filtros de fecha por dia completo (`libracore.fechas`, ADR-037): una fila con hora del ultimo dia entra en reportes, listados y libros. Sin migracion.
    # v1.148.0 -> v1.149.0 (2026-10-09): en una demo (`DEMO_MODE=1`) la empresa es siempre ficticia: `config_manager.load()` pisa los datos de la empresa y `resolve_logo_path()` solo devuelve el logo de demo (ADR-038 de libracore). Fuera de una demo no cambia nada. Sin migracion.
    # v1.149.0 -> v1.150.0 (2026-10-09): `libracore-demo-codigos` (ADR-039): el reset de la demo guarda y devuelve los codigos de acceso. Sin migracion.
    # v1.150.0 -> v1.151.0 (2026-10-09): un plan retirado se resuelve con `PLANES_RETIRADOS` en el alta y en el cambio de plan (`provisioning.resolver_plan`, libracore#375). Este producto no retira planes: no cambia nada. Sin migracion.
    # v1.152.0 -> v1.153.0 (2026-10-10): sucursales contratadas y abono por unidad adicional (`libracore.limites` y `libracore.abono`, ADR-041). Sin dato de sucursales contratadas no limita nada; este producto no lo usa. Sin migracion.
    # v1.153.0 -> v1.154.0 (2026-10-12): `libracore.cuit.solo_digitos` y se retira `cc_resumen` (codigo muerto, nadie lo usaba). Sin migracion.
    # v1.154.0 -> v1.155.0 (2026-10-12): migracion 0024 retira cc_resumenes_enviados y clients.cc_resumen_* (ADR-042). Desplegar el producto ANTES de migrar.
    # v1.155.0 -> v1.157.0 (2026-10-12): `libracore.auditoria` (ADR-043): las escrituras de clients avisan a un registrador, apagado si el producto no lo configura. v1.156.0 es un tag erroneo, no usar. Sin migracion.
    # v1.157.0 -> v1.159.0 (2026-10-13): `libracore.candados` y `config.json` atomico (varios procesos, ADR-044) y `libracore.errores` (registro de errores, ADR-045; `POST /api/errores-cliente`). Sin migracion; todo opt-in. (La v1.158.0 trae los varios procesos y la v1.159.0 el registro de errores.)
    # v1.159.0 -> v1.162.0 (2026-10-13): concepto sin «Factura» doble con migracion 0025 (corre al migrar, backup antes), alta por CLI con aviso de casilla y `panel_admin casilla`, se retira `get_cc_movimientos_periodo` y los adicionales quedan fuera de la escalera de planes (ADR-048, sin migracion).
    # v1.163.0 -> v1.164.0 (2026-10-14): cada envio por mail de un comprobante o un presupuesto deja rastro (`envios_email`, ADR-050 de libracore): `GET .../{id}/envios`, `envios_email` en el detalle y `envio_email` en el listado. **Migracion `0026_envios_email`** (tabla nueva) en la cadena de `libracore-migrar`.
    # v1.164.0 -> v1.166.0 (2026-10-14): incluye v1.165.0 (un proceso sin el almacen de secretos dice la causa) y `GET /api/facturas?envio=enviada|sin_enviar` filtra el listado por el rastro de envios por mail (ADR-051 de libracore). Sin migracion.
    # v1.167.0 -> v1.168.0 (2026-10-15, propuesta; ADR-053 de libracore): `libracore.docs_api.cerrar_docs_de_la_api`: `/docs`, `/redoc` y `/openapi.json` sólo con `ENV=development` (o `LIBRA_DOCS_API=1`); en un cliente real y en la demo dan 404. Sin migracion. `uv.lock` se regenera cuando exista el tag.
    # v1.168.0 -> v1.170.0 (2026-10-15): v1.169.0 suma `fk_de_producto.soltar_fk` (ADR-056; sin efecto en este producto, la usa LibraDesk) y v1.170.0 hace que `delete_client` bloquee la baja de un cliente con cuenta corriente (`cc_pagos`, `cc_debitos`, `recibos` y `cc_asientos` con rol cliente; ADR-057): desactivarlo en vez de borrarlo. Sin migracion.
    # v1.170.0 -> v1.173.0 (2026-10-16): v1.171.0 (ADR-058) no se puede cobrar mas de lo que falta de una factura (409); v1.172.0 (ADR-059 y ADR-060) las notas de credito restan de lo pendiente (resumen y tablero cuentan tambien las cobradas a medias por lo que falta) y cobro por turno; v1.173.0 (ADR-061) una demo no habla con ARCA ni muestra datos fiscales reales (`libracore.demo`). Sin migracion.
    # v1.173.0 -> v1.176.0 (2026-10-17): v1.174.0 `OpcionesCajas.sucursal_por_defecto` (ADR-062, opt-in); v1.175.0 el pago a cuenta corriente bloquea sus facturas en una transaccion (ADR-063) y la nota de debito tiene tope de cobro (ADR-064, 409 si se cobra de mas); v1.176.0 la NC de una factura al contado cobrada acepta `destino` devolver/a_favor (ADR-065, sin `destino` como antes). Sin migracion.
    # v1.176.0 -> v1.181.0 (2026-10-18): v1.177.0 alta con 2 workers y 2 CPU; v1.178.0 lo pendiente de una ND visible (ADR-066); v1.179.0 la NC sin CAE recuerda el destino de la plata (ADR-067, **migracion 0027 aditiva**); v1.180.0 create_remito(conn=) (ADR-068); v1.181.0 HEAD en montar_spa (ADR-069).
    # v1.181.0 -> v1.182.0 (2026-10-18): un solo reloj de Argentina para «hoy» y «ahora» (ADR-070, libracore.fechas.hoy/ahora). Sin migracion.
    # v1.182.0 -> v1.183.0 (2026-10-18): tokens de servicio e integracion propios de cada instancia (ADR-071); con libraauth v0.52.0 (ADR-025, token anterior para rotar sin corte). Sin migracion.
    # v1.183.0 -> v1.184.0 (2026-10-18): los cobros de MercadoPago con el CUIT de quien factura nacen ignorados y no se auto-facturan (ADR-072); `admin.services.clientes_dir()` publica. Sin migracion.
    # v1.184.0 -> v1.184.1 (2026-10-18): tokens por instancia, `${VAR:?mensaje}` se lee del .env (corrige ADR-071). Sin migracion.
    # v1.184.1 -> v1.185.0 (2026-10-18): la nota de debito de una factura a cuenta corriente hereda la cuenta: asienta su debito y se paga con recibo (ADR-073). Sin migracion.
    # v1.185.0 -> v1.186.0 (2026-10-19): facturar en el nodo de LibraEdge con ticket prestado por el central y bandeja al volver (ADR-074). Sin migracion.
    # v1.186.0 -> v1.186.1 (2026-10-19): la bandeja no deja descartar a mano una venta del nodo (completa ADR-074). Sin migracion.
    # v1.186.1 -> v1.186.2 (2026-10-19): el motor se puede importar en Windows (bloqueo de archivo portable, nodo de LibraEdge). Sin migracion.
    # v1.186.2 -> v1.187.0 (2026-10-20): la barra de estado del pie, `GET /api/estado-del-sistema` (ADR-075). Sin migracion.
    # v1.187.0 -> v1.188.0 (2026-10-21): ganchos de caja para que la caja del nodo suba al central (ADR-076). Migracion 0028 aditiva (origen/origen_id).
    # v1.188.0 -> v1.189.0 (2026-10-21): altas de clientes en un nodo: id provisorio y gancho al crear (ADR-077). Sin migracion.
    # v1.189.0 -> v1.190.0 (2026-10-22): libracore-unir-bases para unir la base core dentro de la del dominio (ADR-078). Sin migracion.
    # v1.190.0 -> v1.190.1 (2026-10-22): LibraCargo y LibraClub en _UNA_SOLA_BASE (ADR-078). Sin migracion.
    # v1.190.1 -> v1.191.0 (2026-10-23): cola de comprobantes del nodo offline (cola_arca, ADR-079). Migracion 0029 aditiva.
    # v1.191.0 -> v1.192.0 (2026-10-24): costuras de caja: corregir, extra y gancho del central (ADR-080). Sin migracion.
    # v1.192.0 -> v1.192.1 (2026-10-24): un ciclo con el candado del esquema da deadlock en 1 s, no a los 120 s (ADR-081). Sin migracion.
    # v1.192.1 -> v1.194.0 (2026-10-25): unir-bases con libraauth en el core (ADR-082), GestioLibra y MedLibra de una sola base y tabla de modulos del producto (ADR-083). Sin migracion.
    # v1.194.0 -> v1.195.0 (2026-10-25): `GET /api/nodo/conexion` sin punto de venta (`build_conexion_del_nodo_router`), una sola forma del 202 «en cola» (`cuerpo_en_cola`) y el alta sin la variable del core (ADR-084). Sin migracion.
    # v1.195.0 -> v1.195.1 (2026-10-25): sin los historicos del core de GestioLibra y MedLibra ni la excepcion de VentaLibra (addendum ADR-084). Sin migracion.
    # v1.195.1 -> v1.196.0 (2026-10-26): indices de ajuste (ADR-085, migracion 0030), periodos de contrato y mora (ADR-086).
    # v1.196.0 -> v1.196.1 (2026-10-26): periodo_anclado y sumar_meses publicos (addendum ADR-086). Sin migracion.
    # v1.196.1 -> v1.196.2 (2026-10-26): el dolar A 3500 de un fin de semana o feriado es el del ultimo dia habil (addendum ADR-085). Sin migracion.
    # v1.196.2 -> v1.197.0 (2026-10-26): recibo de un cobro del libro de terceros, por cuenta y orden de (ADR-087). Sin migracion.
    # v1.197.0 -> v1.197.1 (2026-10-26): anular_recibo en la transaccion de quien llama (addendum ADR-087). Sin migracion.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.197.1",
    # libraedge v0.23.0 (2026-10-25): el nodo sin conexion de MedLibra (ADR-045 de este repo). Dependencia NORMAL y no extra, como en
    # VentaLibra, RestoLibra, LibraCargo y LibraClub: el central monta `/sync/v1/*` (push, pull) aunque no tenga nodos. El repo es
    # publico: no hace falta deploy key ni en el CI ni en el build del VPS. v0.23.0 trae los ids provisorios de texto (`"-N"`,
    # `libraedge_mapeo_texto`, ADR-026), que es lo que necesitan los pacientes (`p-NNN`). Sin migracion de los productos.
    # v0.23.0 -> v0.24.1 (2026-10-25): instalador publicado de GestioLibra y MedLibra (ADR-027). Sin migracion.
    # v0.24.1 -> v0.24.3 (2026-10-25): VentaLibra sin la variable del core en el instalador. Sin migracion.
    # v0.24.3 -> v0.25.0 (2026-10-25): el nodo cierra solo lo que se resolvio en el central (ADR-028). Sin migracion.
    "libraedge @ git+https://github.com/marianocappucci/libraedge.git@v0.25.0",
    # v0.8.0 log de accesos, v0.9.0 el de actividad, v0.10.0 el router y
    # v0.11.0 la etiqueta parametrizable -- que es lo que este producto
    # necesita para que el contenido clinico no termine escrito en el log
    # (ver app/auditoria.py).
    #
    # v0.12.0 sale de construir ESTE log y es la que lo vuelve confiable: hasta
    # v0.11.0, si las unicas columnas que cambiaban estaban ocultas, la edicion
    # no se registraba en absoluto. Como aca TODO el contenido clinico esta
    # oculto, corregir una nota o una receta no iba a dejar ningun rastro.
    #
    # v0.38.0 -> v0.40.0 (2026-09-12): el captcha ALTCHA del login y del
    # forgot-password (`captcha=True` en app/routers/auth.py, ADR-014 de
    # libraauth; trae `altcha` como dependencia). v0.39.0, incluida, arregla
    # ademas la IP con la que cuenta el bloqueo por intentos fallidos.
    #
    # v0.40.0 -> v0.43.0 (2026-09-13, ADR-018): `libraauth.usuarios.
    # build_users_router()`, el router de usuarios unico de la familia --
    # reemplaza la copia propia de `app/routers/users.py` (ver ese archivo).
    # Trae ademas la sesion de 8h con renovacion deslizante (ADR-017): llega
    # sola con este bump porque `app/auth.py` re-exporta las dependencias de
    # `libraauth.session_auth` sin envolverlas (verificado, no hace falta
    # sumarles el parametro `response` a mano).
    # v0.48.0 -> v0.49.0 (2026-10-12): `registrador_dbapi` y el formato del log en funciones puras (ADR-022). Sin migracion.
    # v0.49.0 -> v0.50.0 (2026-10-13, ADR-023): `UsadosEnBase`, el anti-replay del captcha en la base (varios procesos). **Migracion `0003_captcha_usados`** en la cadena de `libraauth-migrar`: `exigir_schema_al_dia` la exige al arrancar.
    # v0.50.0 -> v0.51.0 (2026-10-15, ADR-024): el responsable acepta por adelantado la proxima version de los Terminos (`GET /terminos` suma `proxima`, `POST /aceptar` acepta la vigente o la proxima). Sin migracion; el aviso pide libra-ui v0.153.0.
    # v0.52.0 -> v0.53.0 (2026-10-20): la marca Secure de la cookie de sesion es configurable (LIBRAAUTH_COOKIE_SECURE, ADR-026); sin la variable no cambia nada. Sin migracion.
    # v0.53.0 -> v0.54.0 (2026-10-21): en un nodo de LibraEdge los usuarios son los del central (ADR-027); fuera de un nodo no cambia nada. Sin migracion.
    # v0.54.0 -> v0.55.0 (2026-10-21): en un nodo de LibraEdge no se pide captcha y la IP del bloqueo es el par directo (ADR-028); fuera de un nodo no cambia nada. Sin migracion.
    "libraauth[migrations] @ git+https://github.com/marianocappucci/libraauth.git@v0.55.0",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "alembic>=1.13,<2",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=6",
    "pytest-xdist>=3.8",
    "ruff>=0.13",
    "httpx>=0.27,<1",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "sin_aceptar_terminos: deja al test afuera de la excepcion autouse del conftest, para medir el gate de Terminos con el corte puesto de verdad",
    "varios_procesos: levanta uvicorn con --workers 2 de verdad (unos 15 s); se corre solo con `pytest -m varios_procesos`",
]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

# === lint + coverage (agregado 2026-07-31) ===
# Lint activado en los 12 repos de la familia el mismo dia. El ruleset es
# CURADO, no el default de ruff: el default tiraba entre 132 y 224 hallazgos
# por repo, casi todo estilo, y un lint que arranca en rojo se ignora desde el
# primer dia. Estas reglas dan CERO hallazgos hoy en los 12, asi que cualquier
# rojo futuro es una regresion real y no deuda vieja.
#
# F401 (import sin usar) queda AFUERA A PROPOSITO: son ~396 en la familia y
# buena parte son re-exports deliberados en __init__.py, donde el import ES la
# API publica del modulo. Sacarlos a ciegas rompe a quien importa desde ahi.
# Queda como backlog aparte, para revisar a mano archivo por archivo.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
# Un solo regimen de lint para los 17 repos de la familia (etapa E2 de la
# auditoria, 2026-09-03). Antes convivian dos: este --el que ya usaban
# LibraCargo y LibraClub-- y uno mucho mas corto en los otros 15, que solo
# miraba errores seguros en runtime (E9/F63/F7/F811/F821/F822/F823/F841) y
# no veia orden de imports, modernizacion ni los patrones de bugbear.
#
# La longitud queda en 120, que es la que ya usaban 13 de los 15: bajarla a
# 100 agregaba ~400 E501 en la familia, que no tienen fix automatico y no
# arreglan nada.
select = ["E", "F", "I", "UP", "B"]

# 🔴 TRINQUETE, no "reglas que no importan". Cada linea lleva la cuenta del
# dia que se unifico el regimen: la lista SOLO se achica, y lo que no esta
# aca ya no puede entrar en codigo nuevo. Los casos auto-corregibles
# (orden de imports y modernizacion) se arreglaron en el mismo commit.
ignore = [
    "B904",      # 95 caso(s): `raise ... from err` dentro de un except. Ruff NO tiene fix, ni
              #   siquiera unsafe: son a mano, una por una.
    "F401",      # 75 caso(s): import sin usar. 🔴 NO se auto-corrige a proposito: de los 430
              #   de la familia, 168 son RE-EXPORTS —`scripts/panel_admin.py`
              #   re-exporta 27 nombres que `libracore.admin.services` usa como
              #   `pa.find_client`, `pa.compose`, `pa._NPM_AVAILABLE`—. Borrarlos
              #   rompe el backoffice en runtime con los tests en verde.
    "E701",      # 4 caso(s): dos sentencias en una linea separadas por `:`.
    "UP031",     # 4 caso(s): formato con `%` en vez de f-string.
    "E402",      # 4 caso(s): import que no esta arriba de todo. Suele ser a proposito
              #   (cargar algo antes de importar), asi que se mira caso por caso.
    "B008",      # 3 caso(s): llamada a funcion en el default de un argumento. Los `Depends()`
              #   de FastAPI ya estan exceptuados abajo; estos son otros.
    "E741",      # 2 caso(s): nombre de variable ambiguo (`l`, `I`, `O`). Renombrar a mano.
    "E501",      # 1 caso(s): linea de mas de 120. Sin fix automatico: hay que reescribirla.
]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las escribe el autogenerate: no se reformatean a mano.
"**/migrations/versions/*.py" = ["E501"]
# En un `__init__.py` el import "sin usar" ES la interfaz del paquete.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` en el default es el idioma de FastAPI, no un descuido.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File",
    "fastapi.Form", "fastapi.Header", "fastapi.Cookie", "fastapi.Body",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/.venv/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Piso de cobertura. Es un TRINQUETE, no una meta: se fijo 2 puntos por
# debajo de lo que el repo mide (95%, medido el 2026-09-03), asi que hoy pasa
# holgado y lo unico que puede ponerlo en rojo es una regresion. Cuando la
# cobertura suba de verdad, subir tambien este numero -- nunca bajarlo para
# que pase un cambio.
fail_under = 93
