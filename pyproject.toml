[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medlibra"
version = "0.1.0.dev0"
description = "Vertical de turnos para salud: consultorios, profesionales y centros medicos."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "libragenda @ git+https://github.com/marianocappucci/libragenda.git@v0.9.0",
    # libracore sigue proveyendo facturacion/caja/ARCA. El auth SALIO de aca el
    # 2026-07-30 y ahora lo da libraauth (ver app/auth.py y app/services/users.py).
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v0.18.0",
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.1.2",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "alembic>=1.13,<2",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
