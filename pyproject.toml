[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medlibra"
version = "0.1.0.dev0"
description = "Vertical de turnos para salud: consultorios, profesionales y centros medicos."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "libragenda @ git+https://github.com/marianocappucci/libragenda.git@v0.9.0",
    # libracore sigue proveyendo facturacion/caja/ARCA. El auth SALIO de aca el
    # 2026-07-30 y ahora lo da libraauth (ver app/auth.py y app/services/users.py).
    #
    # v1.6.0 -> v1.8.0 (2026-08-04). Hoy este producto NO usa `pdf_generator`
    # ni `ticket_generator` (verificado: cero imports), asi que ni el arreglo
    # del PDF de v1.7.0 ni la maqueta compacta de v1.8.0 cambian nada de lo que
    # se ve hoy. Se sube igual, y no es cosmetico: el modulo de facturacion es
    # una incorporacion probable, y cuando llegue va a usar esos generadores.
    # Que el pin ya este arriba significa que el modulo aterriza sobre la base
    # arreglada en vez de heredar un bug conocido -- hasta v1.6.0 un guion
    # largo en el nombre de empresa devolvia 500 al descargar el comprobante.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.8.2",
    # v0.8.0 log de accesos, v0.9.0 el de actividad, v0.10.0 el router y
    # v0.11.0 la etiqueta parametrizable -- que es lo que este producto
    # necesita para que el contenido clinico no termine escrito en el log
    # (ver app/auditoria.py).
    #
    # v0.12.0 sale de construir ESTE log y es la que lo vuelve confiable: hasta
    # v0.11.0, si las unicas columnas que cambiaban estaban ocultas, la edicion
    # no se registraba en absoluto. Como aca TODO el contenido clinico esta
    # oculto, corregir una nota o una receta no iba a dejar ningun rastro.
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.12.0",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "alembic>=1.13,<2",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=6",
    "ruff>=0.13",
    "httpx>=0.27,<1",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

# === lint + coverage (agregado 2026-07-31) ===
# Lint activado en los 12 repos de la familia el mismo dia. El ruleset es
# CURADO, no el default de ruff: el default tiraba entre 132 y 224 hallazgos
# por repo, casi todo estilo, y un lint que arranca en rojo se ignora desde el
# primer dia. Estas reglas dan CERO hallazgos hoy en los 12, asi que cualquier
# rojo futuro es una regresion real y no deuda vieja.
#
# F401 (import sin usar) queda AFUERA A PROPOSITO: son ~396 en la familia y
# buena parte son re-exports deliberados en __init__.py, donde el import ES la
# API publica del modulo. Sacarlos a ciegas rompe a quien importa desde ahi.
# Queda como backlog aparte, para revisar a mano archivo por archivo.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
select = [
    "E9",    # el archivo no parsea, o error de IO al leerlo
    "F63",   # comparaciones invalidas (`is` contra un literal, `in` mal usado)
    "F7",    # `break` / `continue` / `return` fuera de lugar
    "F811",  # redefinicion de un nombre ya definido o importado
    "F821",  # nombre no definido -> NameError seguro en runtime
    "F822",  # nombre listado en __all__ que no existe en el modulo
    "F823",  # variable local usada antes de asignarse
    "F841",  # variable asignada y nunca usada (codigo muerto)
    "F541",  # f-string sin placeholders (suele ser llaves olvidadas)
    "F502", "F506", "F522", "F524",  # %/format() con argumentos mal armados
    "F601", "F602",                  # `x in 1, 2` en vez de `x in (1, 2)`
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/.venv/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Piso de cobertura. Es un TRINQUETE, no una meta: se fijo 2 puntos por
# debajo de lo que el repo media el 2026-07-31 (94%), asi que hoy pasa
# holgado y lo unico que puede ponerlo en rojo es una regresion. Cuando la
# cobertura suba de verdad, subir tambien este numero -- nunca bajarlo para
# que pase un cambio.
fail_under = 92
