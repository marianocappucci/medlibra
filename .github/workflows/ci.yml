name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # SQLite is the production default for the whole Libra family (silo
    # deployment: one isolated instance per client) -- no service
    # container needed, the smoke check below runs against a plain file.
    env:
      DATABASE_URL: sqlite:///${{ github.workspace }}/ci.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # libragenda and libracore are private repos, unreachable with the
      # default GITHUB_TOKEN (scoped to this repo only). LIBRA_PAT is a
      # fine-grained PAT with read-only Contents access to just those two
      # repos -- see README.md for how to set it up.
      - name: Configure git for private Libra dependencies
        run: git config --global url."https://${{ secrets.LIBRA_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      # Smoke check for the two independent Alembic chains this repo
      # depends on: LibraGenda's own (engine schema) applied first, then
      # this repo's own (migrations/, users/patients/clinical_notes) on
      # top of it -- same order and same commands as a real deploy (see
      # README.md).
      - name: Apply LibraGenda migrations
        run: |
          LIBRAGENDA_REF=$(grep -oP 'libragenda\.git@\K\S+(?=")' pyproject.toml)
          git clone --depth 1 --branch "$LIBRAGENDA_REF" https://github.com/marianocappucci/libragenda.git /tmp/libragenda-src
          LIBRAGENDA_REF="$LIBRAGENDA_REF" DATABASE_URL="$DATABASE_URL" bash /tmp/libragenda-src/scripts/run_migrations.sh

      - name: Apply MedLibra's own migrations
        run: alembic upgrade head
