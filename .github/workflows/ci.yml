name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # SQLite is the production default for the whole Libra family (silo
    # deployment: one isolated instance per client) -- no service
    # container needed, the smoke check below runs against a plain file.
    env:
      DATABASE_URL: sqlite:///${{ github.workspace }}/ci.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # libragenda y libracore son repos privados, inalcanzables con el
      # GITHUB_TOKEN por defecto (scopeado solo a este repo). Se accede con
      # deploy keys SSH de solo lectura, una por repo-motor, cuyas claves
      # privadas viven en los secrets de abajo.
      #
      # Por que deploy keys y no un PAT: un PAT vence sin aviso y tumba el
      # CI de todos los repos que lo comparten a la vez (y en el VPS tumbo
      # un deploy real: incidente Restolibra del 2026-07-25). Las deploy
      # keys no vencen. Mismo mecanismo que ya usa el VPS.
      #
      # El alias `github-<repo>` con IdentitiesOnly no es adorno: con dos
      # claves cargadas, SSH las ofrece en orden y GitHub autentica con la
      # primera que acepta, que puede no ser la del repo que se esta
      # clonando -- una deploy key ES una identidad por repo. El alias
      # fuerza la correcta. Es el mismo error que ya se pago en el VPS.
      #
      # El `git clone` de libragenda del paso de migraciones queda cubierto
      # por el mismo `insteadOf`, sin tocar ese paso.
      - name: Configure SSH access to private Libra dependencies
        env:
          LIBRACORE_DEPLOY_KEY: ${{ secrets.LIBRACORE_DEPLOY_KEY }}
          LIBRAGENDA_DEPLOY_KEY: ${{ secrets.LIBRAGENDA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          configurar() {
            repo=$1; clave=$2
            if [ -z "$clave" ]; then
              echo "::error::Falta el secret con la deploy key de $repo en este repositorio."
              exit 1
            fi
            printf '%s\n' "$clave" > ~/.ssh/id_"$repo"
            chmod 600 ~/.ssh/id_"$repo"
            printf 'Host github-%s\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/id_%s\n  IdentitiesOnly yes\n' \
              "$repo" "$repo" >> ~/.ssh/config
            git config --global \
              url."git@github-$repo:marianocappucci/$repo".insteadOf \
              "https://github.com/marianocappucci/$repo"
          }
          configurar libracore "$LIBRACORE_DEPLOY_KEY"
          configurar libragenda "$LIBRAGENDA_DEPLOY_KEY"

      # Confirma que cada clave autentica contra SU repo y no contra otro:
      # es exactamente el modo de fallar que motiva los alias de arriba, y
      # sin este paso recien se notaria dentro del pip install, como un
      # error de git que no dice cual de las dos claves se uso.
      - name: Verify each deploy key resolves to its own repo
        run: |
          for repo in libracore libragenda; do
            saludo=$(ssh -o StrictHostKeyChecking=yes -T "git@github-$repo" 2>&1 || true)
            echo "$repo -> $saludo"
            case "$saludo" in
              *"marianocappucci/$repo"*) ;;
              *) echo "::error::La deploy key de $repo no resuelve a marianocappucci/$repo."; exit 1 ;;
            esac
          done

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      # Smoke check for the two independent Alembic chains this repo
      # depends on: LibraGenda's own (engine schema) applied first, then
      # this repo's own (migrations/, users/patients/clinical_notes) on
      # top of it -- same order and same commands as a real deploy (see
      # README.md).
      - name: Apply LibraGenda migrations
        run: |
          LIBRAGENDA_REF=$(grep -oP 'libragenda\.git@\K\S+(?=")' pyproject.toml)
          git clone --depth 1 --branch "$LIBRAGENDA_REF" https://github.com/marianocappucci/libragenda.git /tmp/libragenda-src
          LIBRAGENDA_REF="$LIBRAGENDA_REF" DATABASE_URL="$DATABASE_URL" bash /tmp/libragenda-src/scripts/run_migrations.sh

      - name: Apply MedLibra's own migrations
        run: alembic upgrade head
